<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sangeet invitation film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Figtree:wght@400;500;600&display=swap">
<style>
/* One 9:16 stage. Top: string lights, disco ball, sweeping spotlights. Middle: the cartoon couple dancing on a glowing floor.
   Bottom: the invitation text. Single night-time look: plum, magenta, gold, teal. */
:root {
  --page: #0f0a03;
  --cream: #fff6df;
  --gold: #f6c453;
  --magenta: #f6c453;
  --teal: #ffe9a6;
  --display: 'Rozha One', Georgia, 'Times New Roman', serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
@property --d { syntax: '<integer>'; inherits: false; initial-value: 0; }

html, body { height: 100%; }
body { background: var(--page); color: var(--cream); font-family: var(--body); }
.frame {
  height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage {
  position: relative; overflow: hidden; container-type: size; border-radius: 14px;
  width: min(100%, calc((100svh - 90px) * 9 / 16)); aspect-ratio: 9 / 16;
  background: radial-gradient(ellipse at 50% 38%, #9a6f16 0%, #5a3d0a 38%, #2a1b05 68%, #120b02 100%); color: var(--cream);
}
.controls { display: flex; gap: 8px; }
.controls button {
  min-height: 44px; padding: 0 22px; border-radius: 999px; cursor: pointer; font: 500 15px var(--body);
  color: var(--cream); background: transparent; border: 1px solid rgba(246, 196, 83, 0.6);
}
.controls button:hover { border-color: var(--gold); color: #fff; }
.controls button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.stage.done ~ .controls .again { background: var(--gold); color: #2a1b05; border-color: var(--gold); }

.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.bar { position: absolute; z-index: 9; top: 0; left: 0; right: 0; height: 3px; background: rgba(255, 240, 250, 0.15); }
.bar i { display: block; height: 100%; background: var(--gold); transform-origin: left; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.notes { position: absolute; inset: 0; z-index: 3; overflow: hidden; pointer-events: none; }
.notes span { position: absolute; bottom: 48cqw; left: var(--x); font-size: var(--s); color: var(--c); opacity: 0; }

.txt {
  position: absolute; z-index: 2; left: 0; right: 0; top: 101cqw; bottom: 0; padding-inline: 6cqw; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.txt p, .txt h1, .txt h2 { margin: 0; }
.kicker { font-size: 3.8cqw; color: #f3dfa9; }
.event { margin-top: 0.5cqw !important; font: 400 14cqw/1.05 var(--display); color: #f6c453; white-space: nowrap; filter: drop-shadow(0 0 1.6cqw rgba(246, 196, 83, 0.55)); }
.event .ch { color: #f6c453; background: linear-gradient(100deg, #b8860b 0%, #f6c453 30%, #fff6c8 50%, #f6c453 70%, #b8860b 100%); background-size: 300% 100%; background-position: 40% 0; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.names { margin-top: 0.6cqw !important; font: 400 6.6cqw/1.15 var(--display); white-space: nowrap; }
.rule { width: 18cqw; height: 0.6cqw; margin: 2.2cqw auto 0; background: var(--magenta); border-radius: 1cqw; }
.when { margin-top: 2cqw !important; font: 600 4.5cqw/1.2 var(--body); }
.where { margin-top: 0.5cqw !important; font: 500 4.2cqw/1.2 var(--body); color: #f3dfa9; }
.dress { margin-top: 1.6cqw !important; max-width: 80cqw; font-size: 3.2cqw; line-height: 1.3; color: #f3dfa9; }
.ask { margin-top: 1.6cqw !important; max-width: 84cqw; font: 600 3.6cqw/1.25 var(--body); color: var(--gold); }
.cnt { margin-top: 1.8cqw !important; display: flex; align-items: baseline; justify-content: center; gap: 1.6cqw; font-size: 3.8cqw; color: #f3dfa9; }
.num { --days: 58; --d: var(--days); font: 400 8.5cqw/1 var(--display); color: #ffe9a6; font-variant-numeric: tabular-nums; }
.num::before { counter-reset: d var(--d); content: counter(d); }
.ch { display: inline-block; }
.ch.amp { color: var(--magenta); }

/* ---------- cartoon people ---------- */
.art .eyes { transform-box: fill-box; transform-origin: center; }
.art .arm { transform-box: view-box; }
.art .arm-l { transform: rotate(150deg); }
.art .arm-r { transform: rotate(-150deg); }
.art .tile { fill: #c8962a; }
.art .spot { transform-box: view-box; }

/* ---------- the film: 14 seconds, then the couple keep dancing ---------- */
.play .bar i { animation: bar 14s linear both; }
.paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; }

.play .bulb { animation: twinkle 1.6s ease-in-out calc(var(--k) * 0.17s) infinite alternate both; }
.play .string { animation: drop 1s ease-out 0.2s both; }
.play .ball { animation: drop 1.2s cubic-bezier(0.3, 1.25, 0.5, 1) 0.5s both, ball-sway 3s ease-in-out 1.7s infinite alternate; }
.play .shine { animation: shine 2.4s linear 1.2s infinite; }
.play .spot-a { animation: fade-in 1s ease-out 1s both, sweep-a 5s ease-in-out 1s infinite alternate; }
.play .spot-b { animation: fade-in 1s ease-out 1.2s both, sweep-b 5.6s ease-in-out 1s infinite alternate; }
.play .tile { animation: tile 3s linear calc(var(--k) * 0.25s) infinite; }
.play .rise-g { animation: rise 1.2s cubic-bezier(0.2, 1.2, 0.4, 1) calc(1.6s + var(--k) * 0.3s) both; }
.play .sway-g { animation: sway-a 1.2s ease-in-out 3s infinite alternate both; }
.play .sway-b { animation: sway-b 1.2s ease-in-out 3s infinite alternate both; }
.play .bob { animation: bob 0.6s ease-in-out 3s infinite alternate both; }
.play .eyes { animation: blink 4.2s linear calc(2s + var(--k) * 1.1s) infinite; }
.play .arm-l { animation: dance-l 1.2s ease-in-out calc(3s + var(--k) * 0.3s) infinite alternate both; }
.play .arm-r { animation: dance-r 1.2s ease-in-out calc(3.6s + var(--k) * 0.3s) infinite alternate both; }
.play .notes span { animation: float var(--t) ease-out calc(3.2s + var(--dl)) infinite; }
.play .kicker { animation: fade-up 0.8s ease-out 6.1s both; }
.play .event .ch { animation: bounce-in 0.8s cubic-bezier(0.3, 1.6, 0.5, 1) calc(6.4s + var(--i) * 90ms) both, shimmer 2.6s linear calc(7.6s + var(--i) * 0.12s) infinite; }
.play .names .ch { animation: ch-in 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) calc(7.4s + var(--i) * 55ms) both; }
.play .rule { animation: grow 0.8s ease-out 8.6s both; }
.play .when { animation: fade-up 0.8s ease-out 8.8s both; }
.play .where { animation: fade-up 0.8s ease-out 9.1s both; }
.play .dress { animation: fade-up 0.8s ease-out 9.5s both; }
.play .ask { animation: fade-up 0.8s ease-out 10.1s both; }
.play .cnt { animation: fade-up 0.8s ease-out 10.7s both; }
.play .num { animation: count 1.6s ease-out 11s both; }


.art .burst { display: none; }
.play .art .burst { display: block; }
.art .burst g { transform-box: fill-box; transform-origin: center; }
.art .couple-pop, .art .couple-dance { transform-box: fill-box; transform-origin: 50% 100%; }
.play .couple-pop { animation: pop-in 1.3s cubic-bezier(0.2, 1.25, 0.4, 1) 1.6s both; }
.play .couple-dance { animation: groove 0.6s ease-in-out 3s infinite alternate both; }
.play .burst g { animation: burst 1.7s ease-out calc(2.6s + var(--k) * 0.02s) both; }
@keyframes pop-in { from { opacity: 0; transform: translateY(14px) scale(0.86); } to { opacity: 1; transform: none; } }
@keyframes groove { from { transform: rotate(-2.2deg) translateY(0); } to { transform: rotate(2.2deg) translateY(-1.6px); } }
@keyframes burst { 0% { transform: translate(0, 0) scale(0.2) rotate(0); opacity: 0; } 8% { opacity: 1; } 100% { transform: translate(calc(var(--dx) * 1px), calc(var(--dy) * 1px)) scale(1) rotate(260deg); opacity: 0; } }

.art .sparkle { transform-box: fill-box; transform-origin: center; opacity: 0.9; }
.play .sparkle { animation: tw 1.8s ease-in-out calc(var(--k) * 0.19s) infinite; }
@keyframes tw { 0%, 100% { opacity: 0; transform: scale(0.2) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes fade-up { from { opacity: 0; transform: translateY(2.4cqw); } to { opacity: 1; transform: none; } }
@keyframes bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes count { from { --d: 0; } to { --d: var(--days); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes ch-in { from { opacity: 0; transform: translateY(40%); filter: blur(0.8cqw); } to { opacity: 1; transform: none; filter: blur(0); } }
@keyframes bounce-in { from { opacity: 0; transform: translateY(-60%) scale(0.6); } to { opacity: 1; transform: none; } }
@keyframes drop { from { transform: translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes twinkle { from { opacity: 0.35; } to { opacity: 1; } }
@keyframes ball-sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes shine { 0% { opacity: 0; transform: translateX(-4px); } 40% { opacity: 0.9; } 100% { opacity: 0; transform: translateX(4px); } }
@keyframes sweep-a { from { transform: rotate(-16deg); } to { transform: rotate(14deg); } }
@keyframes sweep-b { from { transform: rotate(16deg); } to { transform: rotate(-14deg); } }
@keyframes tile { 0%, 100% { fill: #b8860b; } 33% { fill: #f6c453; } 66% { fill: #ffe9a6; } }
@keyframes rise { from { transform: translateY(70px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sway-a { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes sway-b { from { transform: rotate(3deg); } to { transform: rotate(-3deg); } }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
@keyframes dance-l { from { transform: rotate(45deg); } to { transform: rotate(155deg); } }
@keyframes dance-r { from { transform: rotate(-45deg); } to { transform: rotate(-155deg); } }
@keyframes float {
  0% { transform: translate(0, 0) rotate(-10deg); opacity: 0; }
  12% { opacity: 0.95; }
  100% { transform: translate(var(--dx), -62cqw) rotate(18deg); opacity: 0; }
}

.art .spk{opacity:.9}
.play .spk{animation:spk 1.6s ease-in-out calc(var(--q) * .23s) infinite alternate both}
@keyframes spk{from{opacity:.1}to{opacity:1}}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  .notes { display: none; }
}
/* Full-screen mode for the phone slideshow (?full=1): the 9:16 stage covers the whole screen, a little of the sides
   may be trimmed on tall phones, and the film's own buttons are hidden because the slideshow has its own. */
html.full .frame { padding: 0; gap: 0; overflow: hidden; position: relative; }
html.full .stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 0;
  width: max(100vw, calc(100vh * 9 / 16)); height: auto; aspect-ratio: 9 / 16; }
html.full .controls, html.full .bar { display: none; }
html.full .txt { padding-inline: max(6cqw, calc((100cqw - 100vw) / 2 + 4cqw)); }
html.full .txt > * { max-width: 100% !important; }
.num.js-count::before { content: none; }
.num.js-count .sr { position: static; width: auto; height: auto; overflow: visible; clip: auto; white-space: nowrap; }
</style>

</head>
<body>
<main class="frame">
  <section class="stage" id="stage" aria-label="Sangeet invitation for Simran and Farhan">
    <div class="bar" aria-hidden="true"><i></i></div>
    <svg class="art" id="art" viewBox="0 0 100 177.78" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe9a6" stop-opacity="0.55"/><stop offset="1" stop-color="#ffe9a6" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g class="spot spot-a" style="transform-origin: 18px 0px"><polygon points="18,0 0,92 38,92" fill="url(#beam)"/></g>
      <g class="spot spot-b" style="transform-origin: 82px 0px"><polygon points="82,0 62,92 100,92" fill="url(#beam)"/></g>
      <g id="lights"></g>
      <g class="ball" id="ball" style="transform-origin: 50px 2px"></g>
      <g id="people"></g>
      <g id="floor" transform="translate(0 6)"></g>
      <g class="burst" id="burst"></g>
    </svg>
    <div class="notes" id="notes" aria-hidden="true"></div>

    <div class="txt">
      <p class="kicker" id="kicker"></p>
      <h1 class="event" id="event" data-split></h1>
      <h2 class="names" id="names" data-split></h2>
      <div class="rule" aria-hidden="true"></div>
      <p class="when" id="when"></p>
      <p class="where" id="where"></p>
      <p class="dress" id="dress"></p>
      <p class="ask" id="ask"></p>
      <p class="cnt" id="cnt"><span class="num" id="num"><span class="sr" id="numText">58</span></span> <span id="unit">days to go</span></p>
    </div>
  </section>
  <div class="controls">
    <button type="button" id="pause" aria-pressed="false">Pause</button>
    <button type="button" id="again" class="again">Watch again</button>
  </div>
</main>

<script>
if (/[?&]full=1\b/.test(location.search)) document.documentElement.classList.add('full');
</script>
<script>
(function () {
  // Everything that changes per event lives here. Time and venue are placeholders until the family confirms them.
  var EVENT = {
    kicker: 'Dance the night away at the',
    name: 'Sangeet',
    couple: 'Simran & Farhan',
    date: '2026-12-23',
    time: '5:00 PM',
    venue: 'Venue to be confirmed',
    dress: 'Dress code: sparkly. Wear something that shines.',
    ask: 'Got a dance or a song in mind? Tell us when you reply.'
  };
  (function () {
    var q = new URLSearchParams(location.search);
    ['date', 'time', 'venue', 'dress', 'couple'].forEach(function (k) { if (q.get(k)) EVENT[k] = q.get(k); });
  })();

  var NS = 'http://www.w3.org/2000/svg';
  var stage = document.getElementById('stage');
  var pauseBtn = document.getElementById('pause');
  var againBtn = document.getElementById('again');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function svg(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function html(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }

  /* ---------- text ---------- */
  var when = new Date(EVENT.date + 'T00:00:00');
  document.getElementById('kicker').textContent = EVENT.kicker;
  document.getElementById('event').textContent = EVENT.name;
  document.getElementById('names').textContent = EVENT.couple;
  document.getElementById('when').textContent = when.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('where').textContent = EVENT.time + '  ·  ' + EVENT.venue;
  document.getElementById('dress').textContent = EVENT.dress;
  document.getElementById('ask').textContent = EVENT.ask;

  document.querySelectorAll('[data-split]').forEach(function (h) {
    var text = h.textContent;
    h.setAttribute('aria-label', text);
    h.textContent = '';
    Array.from(text).forEach(function (ch, idx) {
      var s = html('span', ch === '&' ? 'ch amp' : 'ch');
      s.setAttribute('aria-hidden', 'true');
      s.style.setProperty('--i', idx);
      s.textContent = ch === ' ' ? ' ' : ch;
      h.appendChild(s);
    });
  });

  // Days to go: calendar days in India time, so it matches the date on the invitation wherever the guest is.
  var dp = EVENT.date.split('-'), ist = new Date(Date.now() + 19800000);
  var days = Math.round((Date.UTC(+dp[0], dp[1] - 1, +dp[2]) - Date.UTC(ist.getUTCFullYear(), ist.getUTCMonth(), ist.getUTCDate())) / 864e5);
  var cnt = document.getElementById('cnt');
  if (days > 1) {
    document.getElementById('num').style.setProperty('--days', days);
    document.getElementById('numText').textContent = days;
    document.getElementById('unit').textContent = 'days to go';
  } else if (days === 1) cnt.textContent = 'Tomorrow';
  else if (days === 0) cnt.textContent = 'Today is the day';
  else cnt.hidden = true;
  // Count up in script (CSS counters driven by an animated property don't repaint reliably everywhere).
  // The CSS "count" animation still sets the timing; the number itself is written into the text.
  (function () {
    var num = document.getElementById('num'), txt = document.getElementById('numText');
    if (!(days > 1)) return;
    num.classList.add('js-count');
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { txt.textContent = days; return; }
    txt.textContent = '0';
    var started = false;
    function run(ms) {
      if (started) return; started = true;
      var t0 = performance.now();
      (function step(t) {
        var k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
        txt.textContent = Math.round(days * e);
        if (k < 1) requestAnimationFrame(step);
      })(t0);
    }
    num.addEventListener('animationstart', function (ev) {
      if (ev.animationName === 'count') run((parseFloat(getComputedStyle(num).animationDuration) || 1.6) * 1000);
    });
    setTimeout(function () { if (!started) txt.textContent = days; }, 15000); // fallback if the animation never runs
  })();

  /* ---------- the couple (original illustrations, drawn in code) ---------- */
  var SKIN_B = '#e5b293', SKIN_G = '#d9a07f', HAIR = '#1b1210';

  function arm(px, py, side, k, sleeve, skin) {
    return '<g class="arm ' + (side === 'l' ? 'arm-l' : 'arm-r') + '" style="--k:' + k + ';transform-origin:' + px + 'px ' + py + 'px">' +
      '<line x1="' + px + '" y1="' + py + '" x2="' + px + '" y2="' + (py + 44) + '" stroke="' + sleeve + '" stroke-width="13" stroke-linecap="round"/>' +
      '<circle cx="' + px + '" cy="' + (py + 50) + '" r="7.2" fill="' + skin + '"/>' + (skin === SKIN_B ? '<circle cx="' + px + '" cy="' + (py + 50) + '" r="4.6" fill="#8a3a1f" opacity="0.75"/><circle cx="' + px + '" cy="' + (py + 41) + '" r="6.8" fill="none" stroke="#d9a53a" stroke-width="1.6"/>' : '') + '</g>';
  }

  function bride(k) {
    var sp = '';
    [[22,40],[34,70],[26,104],[98,44],[88,76],[96,110],[44,128],[76,132],[60,118]].forEach(function (p, n) {
      sp += '<circle class="spk" style="--q:' + n + '" cx="' + p[0] + '" cy="' + p[1] + '" r="1.5" fill="#fff"/>';
    });
    return '<g class="rise-g" style="--k:' + k + '"><g class="sway-b"><g class="bob" style="--k:' + k + '">' +
      arm(23, 118, 'l', k, '#efdcbc', SKIN_B) + arm(97, 118, 'r', k, '#efdcbc', SKIN_B) + +
      '<path d="M60 4 C20 8 4 62 2 150 L118 150 C116 62 100 8 60 4 Z" fill="#f6e8cf" fill-opacity="0.8" stroke="#d9a53a" stroke-width="1.6" stroke-dasharray="0.1 4" stroke-linecap="round"/>' +
      '<path d="M30 66 C16 26 42 6 60 6 C80 6 104 26 90 66 C98 92 104 118 98 150 L22 150 C16 118 22 92 30 66 Z" fill="#1b1210"/>' +
      '<path d="M28 90 C34 110 26 130 30 148 M92 90 C86 110 94 130 90 148" fill="none" stroke="#3a2420" stroke-width="2" stroke-linecap="round"/>' +
      '<rect x="52" y="72" width="16" height="28" rx="6" fill="#d9a07f"/>' +
      '<path d="M17 150 C17 114 38 96 60 96 C82 96 103 114 103 150 Z" fill="#e3c9a0"/>' +
      '<path d="M44 98 L60 114 L76 98" fill="none" stroke="#f6e8cf" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M50 96 L60 110 L70 96 Z" fill="#e5b293"/>' +
      '<path d="M45 90 Q60 104 75 90" fill="none" stroke="#d3dae2" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.1 4.4"/>' +
      '<ellipse cx="60" cy="52" rx="24" ry="27" fill="#e5b293"/>' +
      '<path d="M35 52 C32 20 88 20 85 52 C80 34 68 28 58 30 C48 32 38 40 35 52 Z" fill="#1b1210"/>' +
      '<path d="M60 26 C52 30 44 40 38 52" fill="none" stroke="#4a2c24" stroke-width="1.6" stroke-linecap="round"/>' +
      '<ellipse cx="42" cy="62" rx="5" ry="3" fill="#e8736f" opacity="0.45"/><ellipse cx="78" cy="62" rx="5" ry="3" fill="#e8736f" opacity="0.45"/>' +
      '<path d="M43 44 Q50 40 57 44 M63 44 Q70 40 77 44" fill="none" stroke="#1b1210" stroke-width="1.7" stroke-linecap="round"/>' +
      '<g class="eyes" style="--k:' + k + '"><ellipse cx="50" cy="52" rx="2.8" ry="3.4" fill="#4a2a1c"/><ellipse cx="70" cy="52" rx="2.8" ry="3.4" fill="#4a2a1c"/><circle cx="51" cy="50.8" r="0.9" fill="#fff"/><circle cx="71" cy="50.8" r="0.9" fill="#fff"/><path d="M45.5 49 Q50 46.6 54.5 49 M65.5 49 Q70 46.6 74.5 49" fill="none" stroke="#2a1810" stroke-width="1.2" stroke-linecap="round"/></g>' +
      '<path d="M60 55 q-2 5 0 6" fill="none" stroke="#c98d6c" stroke-width="1.2" stroke-linecap="round"/>' +
      '<path d="M52 64 Q60 70 68 64" fill="none" stroke="#c0605a" stroke-width="2" stroke-linecap="round"/>' +
       +
      sp + '</g></g></g>';
  }
  function groom(k) {
    return '<g class="rise-g" style="--k:' + k + '"><g class="sway-g"><g class="bob">' +
      arm(22, 120, 'l', k, '#0e6b62', SKIN_G) + arm(98, 120, 'r', k, '#0e6b62', SKIN_G) +
      '<rect x="53" y="72" width="14" height="28" rx="6" fill="#c98f6e"/>' +
      '<path d="M9 150 C9 112 34 98 60 98 C86 98 111 112 111 150 Z" fill="#0e6b62"/>' +
      '<path d="M50 98 L60 118 L70 98 Z" fill="#f4e6c8"/>' +
      '<line x1="60" y1="118" x2="60" y2="150" stroke="#f4b53f" stroke-width="1.6"/>' +
      '<circle cx="60" cy="124" r="2.2" fill="#f4b53f"/><circle cx="60" cy="134" r="2.2" fill="#f4b53f"/><circle cx="60" cy="144" r="2.2" fill="#f4b53f"/>' +
      '<path d="M22 112 C40 99 80 99 98 112" fill="none" stroke="#f4b53f" stroke-width="3" stroke-linecap="round"/>' +
      '<ellipse cx="35" cy="54" rx="4" ry="6" fill="' + SKIN_G + '"/><ellipse cx="85" cy="54" rx="4" ry="6" fill="' + SKIN_G + '"/>' +
      '<ellipse cx="60" cy="52" rx="25" ry="27" fill="' + SKIN_G + '"/>' +
      '<path d="M35 48 C33 20 87 20 85 48 C82 36 72 31 60 31 C48 31 38 36 35 48 Z" fill="#15100e"/>' +
      '<path d="M36 56 C36 84 84 84 84 56 C81 70 72 74 60 74 C48 74 39 70 36 56 Z" fill="' + HAIR + '"/>' +
      '<path d="M48 63 Q54 59 60 62 Q66 59 72 63 Q66 67 60 65 Q54 67 48 63 Z" fill="' + HAIR + '"/>' +
      '<path d="M53 68 Q60 75 67 68 Q60 70 53 68 Z" fill="#fff"/>' +
      '<path d="M40 39 Q47 36 55 39 M65 39 Q73 36 80 39" fill="none" stroke="#15100e" stroke-width="2" stroke-linecap="round"/>' +
      '<g class="eyes" style="--k:' + k + '"><circle cx="47" cy="50" r="2.6" fill="#2a1810"/><circle cx="73" cy="50" r="2.6" fill="#2a1810"/></g>' +
      '<g fill="rgba(255,255,255,0.14)" stroke="#1d1d1d" stroke-width="1.8"><rect x="38" y="43" width="18" height="13" rx="5"/><rect x="64" y="43" width="18" height="13" rx="5"/></g>' +
      '<path d="M56 49 H64 M38 48 L35 50 M82 48 L85 50" fill="none" stroke="#1d1d1d" stroke-width="1.6" stroke-linecap="round"/>' +
      '</g></g></g>';
  }

  var people = document.getElementById('people');
  var pop = svg('g', { class: 'couple-pop' }, people);
  var dance = svg('g', { class: 'couple-dance' }, pop);
  svg('image', { href: 'sangeet-couple.webp', x: 11, y: 24, width: 78, height: 71.3, preserveAspectRatio: 'xMidYMid meet' }, dance);

  // Confetti thrown up when the couple land.
  var burst = document.getElementById('burst');
  var cc = ['#f6c453', '#ffe9a6', '#b8860b', '#ffffff', '#e8b030'];
  for (var cb = 0; cb < 34; cb++) {
    var ang = (cb / 34) * Math.PI * 2, dist = 24 + (cb % 4) * 9;
    var cg = svg('g', { style: '--k:' + cb + ';--dx:' + (Math.cos(ang) * dist * 1.1).toFixed(1) + ';--dy:' + (Math.sin(ang) * dist - 16).toFixed(1) }, burst);
    svg('rect', { x: 49, y: 64, width: 1.8 + (cb % 3) * 0.6, height: 1.1, rx: 0.3, fill: cc[cb % 5], transform: 'rotate(' + (cb * 37) + ' 50 64)' }, cg);
  }

  /* ---------- string lights, disco ball, floor ---------- */
  var lights = document.getElementById('lights');
  svg('path', { d: 'M-2 4 Q25 16 50 6 T102 4', fill: 'none', stroke: '#a9802a', 'stroke-width': 0.5 }, lights);
  var bulbCols = ['#f6c453', '#ffe9a6', '#e8b030', '#ffffff'];
  for (var i = 0; i < 16; i++) {
    var bx = i * 6.3, by = 4 + (i < 8 ? Math.sin(i / 8 * Math.PI) * 6 : Math.sin((i - 8) / 8 * Math.PI) * 5) + 1;
    var b = svg('circle', { class: 'bulb', cx: bx, cy: by + 1.4, r: 1.5, fill: bulbCols[i % 4], style: '--k:' + i }, lights);
  }

  var ball = document.getElementById('ball');
  svg('line', { x1: 50, y1: 0, x2: 50, y2: 9, stroke: '#e8d08a', 'stroke-width': 0.4 }, ball);
  svg('circle', { cx: 50, cy: 15, r: 6, fill: '#e0b955' }, ball);
  [[47.2, 12.5], [51.2, 11.8], [53.2, 15], [47, 16.6], [50.2, 18.8], [44.9, 14], [55, 12.4]].forEach(function (p, idx) {
    svg('rect', { x: p[0] - 1, y: p[1] - 1, width: 2, height: 2, rx: 0.3, fill: idx % 2 ? '#fff6c8' : '#b8860b' }, ball);
  });
  svg('path', { d: 'M44.4 15 H55.6 M50 9.2 V20.8', stroke: '#8a6414', 'stroke-width': 0.3, fill: 'none' }, ball);
  svg('circle', { class: 'shine', cx: 52, cy: 12.5, r: 1.2, fill: '#fff' }, ball);

  var floor = document.getElementById('floor');
  svg('rect', { x: -2, y: 83, width: 104, height: 15, fill: '#1a1103' }, floor);
  for (var t = 0; t < 8; t++) {
    svg('rect', { class: 'tile', x: t * 12.5 + 0.6, y: 84.4, width: 11.3, height: 12, rx: 1, style: '--k:' + t }, floor);
  }


  // Gold sparkles twinkling across the whole scene, including the beadwork on the lehenga.
  var sp = svg('g', { id: 'sparkles' }, art);
  var spots = [[8,20],[22,12],[40,26],[60,18],[78,10],[92,24],[14,44],[30,52],[48,40],[66,46],[84,38],[94,58],[10,70],[26,82],[44,72],[58,86],[72,68],[88,80],[18,96],[36,92],[64,98],[82,94],[50,56],[70,30],[34,36]];
  spots.forEach(function (p, i) {
    var sz = 1.4 + (i % 4) * 0.7;
    svg('path', { class: 'sparkle', fill: i % 3 ? '#fff3c4' : '#f6c453', style: '--k:' + i,
      d: 'M' + p[0] + ' ' + (p[1] - sz) + ' L' + (p[0] + sz * 0.28) + ' ' + (p[1] - sz * 0.28) + ' L' + (p[0] + sz) + ' ' + p[1] + ' L' + (p[0] + sz * 0.28) + ' ' + (p[1] + sz * 0.28) + ' L' + p[0] + ' ' + (p[1] + sz) + ' L' + (p[0] - sz * 0.28) + ' ' + (p[1] + sz * 0.28) + ' L' + (p[0] - sz) + ' ' + p[1] + ' L' + (p[0] - sz * 0.28) + ' ' + (p[1] - sz * 0.28) + ' Z' }, sp);
  });

  var notes = document.getElementById('notes');
  var glyphs = ['♪', '♫', '♪', '♫', '♪', '♫'];
  var nc = ['#f6c453', '#ffe9a6', '#e8b030', '#ffffff'];
  for (var q = 0; q < 12; q++) {
    var s = html('span');
    s.textContent = glyphs[q % glyphs.length];
    s.style.setProperty('--x', (6 + ((q * 37) % 86)) + '%');
    s.style.setProperty('--s', (5 + (q % 3) * 1.4).toFixed(1) + 'cqw');
    s.style.setProperty('--c', nc[q % nc.length]);
    s.style.setProperty('--dx', (((q % 2) ? 1 : -1) * (3 + (q % 4) * 2)) + 'cqw');
    s.style.setProperty('--dl', ((q * 0.7) % 6).toFixed(1) + 's');
    s.style.setProperty('--t', (5 + ((q * 1.1) % 3)).toFixed(1) + 's');
    notes.appendChild(s);
  }

  /* ---------- controls ---------- */
  function play() {
    stage.classList.remove('play', 'paused', 'done');
    void stage.offsetWidth;
    pauseBtn.setAttribute('aria-pressed', 'false');
    pauseBtn.textContent = 'Pause';
    if (!reduce) stage.classList.add('play');
  }
  pauseBtn.addEventListener('click', function () {
    var paused = stage.classList.toggle('paused');
    pauseBtn.setAttribute('aria-pressed', String(paused));
    pauseBtn.textContent = paused ? 'Play' : 'Pause';
  });
  againBtn.addEventListener('click', play);
  stage.querySelector('.bar i').addEventListener('animationend', function () { stage.classList.add('done'); });
  if (reduce) { pauseBtn.hidden = true; againBtn.hidden = true; }
  play();
})();
</script>
</body>
</html>
