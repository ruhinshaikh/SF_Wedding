<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pink Haldi film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one 9:16 stage. Top third is a marigold garland, the middle is the cartoon couple behind a bank of flowers,
   the bottom is the invitation text. Single bright look: haldi pink, marigold orange, leaf green, deep brown ink. */
:root {
  --page: #1a0a12;
  --ink: #4a0f2b;
  --ink-soft: #8a2c5a;
  --leaf: #1f6b46;
  --marigold: #e8337f;
  --haldi: #ff4f9a;
  --cream: #fff0f6;
  --display: 'Gloock', Georgia, 'Times New Roman', serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
@property --d { syntax: '<integer>'; inherits: false; initial-value: 0; }

html, body { height: 100%; }
body { background: var(--page); color: var(--cream); font-family: var(--body); }
.frame {
  height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage {
  position: relative; overflow: hidden; container-type: size; border-radius: 14px;
  width: min(100%, calc((100svh - 90px) * 9 / 16)); aspect-ratio: 9 / 16;
  background: linear-gradient(180deg, #ffd9e8 0%, #ff9fc6 48%, #ee5f9d 100%); color: var(--ink);
}
.controls { display: flex; gap: 8px; }
.controls button {
  min-height: 44px; padding: 0 22px; border-radius: 999px; cursor: pointer; font: 500 15px var(--body);
  color: var(--cream); background: transparent; border: 1px solid rgba(255, 79, 154, 0.6);
}
.controls button:hover { border-color: var(--haldi); color: #fff; }
.controls button:focus-visible { outline: 3px solid var(--haldi); outline-offset: 2px; }
.stage.done ~ .controls .again { background: var(--haldi); color: #3a0620; border-color: var(--haldi); }

.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.bar { position: absolute; z-index: 9; top: 0; left: 0; right: 0; height: 3px; background: rgba(58, 39, 4, 0.18); }
.bar i { display: block; height: 100%; background: var(--leaf); transform-origin: left; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.petals { position: absolute; inset: 0; z-index: 3; overflow: hidden; pointer-events: none; }
.petals span.f { border-radius: 50%; height: var(--w); background: radial-gradient(circle, #ffd54f 0 24%, var(--c) 26%); }
.petals span { position: absolute; left: var(--x); top: -6cqw; width: var(--w); height: calc(var(--w) * 1.35); border-radius: 100% 0 100% 0; background: var(--c); opacity: 0; }

.txt {
  position: absolute; z-index: 2; left: 0; right: 0; top: 108cqw; bottom: 0; padding-inline: 6cqw; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center;
}
.txt p, .txt h1, .txt h2 { margin: 0; }
.kicker { font-size: 3.8cqw; color: var(--ink-soft); }
.event { margin-top: 0.5cqw !important; font: 400 15cqw/1.05 var(--display); color: #a3124f; white-space: nowrap; }
.names { margin-top: 0.6cqw !important; font: 400 7.2cqw/1.15 var(--display); white-space: nowrap; }
.rule { width: 18cqw; height: 0.5cqw; margin: 2.4cqw auto 0; background: var(--leaf); border-radius: 1cqw; }
.when { margin-top: 2.2cqw !important; font: 600 4.5cqw/1.2 var(--body); }
.time { margin-top: 0.4cqw !important; font: 500 4.2cqw/1.2 var(--body); }
.where { display: none; margin-top: 0.4cqw !important; font: 500 4.2cqw/1.2 var(--body); color: var(--ink-soft); }
.dress { margin-top: 2.2cqw !important; max-width: 76cqw; font-size: 3.3cqw; line-height: 1.35; color: var(--ink-soft); }
.cnt { margin-top: 2.6cqw !important; display: flex; align-items: baseline; justify-content: center; gap: 1.6cqw; font-size: 3.8cqw; color: var(--ink-soft); }
.num { --days: 58; --d: var(--days); font: 400 9cqw/1 var(--display); color: var(--leaf); font-variant-numeric: tabular-nums; }
.num::before { counter-reset: d var(--d); content: counter(d); }
.ch { display: inline-block; }
.ch.amp { color: var(--leaf); }

/* ---------- cartoon people ---------- */
.art .burst { display: none; }
.play .art .burst { display: block; }
.art .burst g { transform-box: fill-box; transform-origin: center; }
.art .couple-pop, .art .couple { transform-box: fill-box; transform-origin: 50% 100%; }
.art .eyes { transform-box: fill-box; transform-origin: center; }
.art .arm { transform-box: view-box; }
.art .arm-l { transform: rotate(150deg); }
.art .arm-r { transform: rotate(-150deg); }
.art .cheek { transform-box: fill-box; transform-origin: center; }

/* ---------- the film: one 14-second timeline ---------- */
.play .bar i { animation: bar 14s linear both; }
.paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; }

.play .glow { animation: fade-in 1.4s ease-out 0.2s both, pulse 4s ease-in-out 1.6s infinite alternate; }
.play .toran { animation: drop 1.4s cubic-bezier(0.3, 1.25, 0.5, 1) 0.2s both; }
.play .strand { animation: sway 4.5s ease-in-out calc(1.6s + var(--k) * 0.4s) infinite alternate both; }
.play .rise-g { animation: rise 1.3s cubic-bezier(0.2, 1.2, 0.4, 1) calc(1.1s + var(--k) * 0.3s) both; }
.play .lean-g { animation: lean 0.9s ease-in-out 2.7s both; }
.play .lean-b { animation: lean-b 0.9s ease-in-out 2.7s both; }
.play .bob { animation: bob 2.2s ease-in-out calc(2.6s + var(--k) * 0.4s) infinite alternate both; }
.play .eyes { animation: blink 4.2s linear calc(2s + var(--k) * 1.1s) infinite; }
.play .cheek { animation: pop 0.7s cubic-bezier(0.3, 1.6, 0.5, 1) 3.5s both; }
.play .burst g { animation: burst 1.7s ease-out calc(5s + var(--k) * 0.025s) both; }
.play .couple-pop { animation: pop-in 1.3s cubic-bezier(0.2, 1.25, 0.4, 1) 4s both; }
.play .couple { animation: floaty 3.4s ease-in-out 5.4s infinite alternate; }
.play .arm-l { animation: up-l 1s cubic-bezier(0.3, 1.5, 0.5, 1) 4.4s both, wave-l 1.2s ease-in-out 5.5s infinite alternate; }
.play .arm-r { animation: up-r 1s cubic-bezier(0.3, 1.5, 0.5, 1) 4.7s both, wave-r 1.2s ease-in-out 5.8s infinite alternate; }
.play .petals span { animation: shower var(--t) linear calc(5.2s + var(--dl)) infinite; }
.play .fg { animation: fade-in 0.8s ease-out 3.9s both; }
.play .kicker { animation: fade-up 0.8s ease-out 6.1s both; }
.play .event .ch { animation: bounce-in 0.8s cubic-bezier(0.3, 1.6, 0.5, 1) calc(6.4s + var(--i) * 90ms) both; }
.play .names .ch { animation: ch-in 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) calc(7.4s + var(--i) * 55ms) both; }
.play .rule { animation: grow 0.8s ease-out 8.6s both; }
.play .when { animation: fade-up 0.8s ease-out 8.8s both; }
.play .time { animation: fade-up 0.8s ease-out 9.1s both; }
.play .where { animation: fade-up 0.8s ease-out 9.4s both; }
.play .dress { animation: fade-up 0.8s ease-out 9.9s both; }
.play .cnt { animation: fade-up 0.8s ease-out 10.5s both; }
.play .num { animation: count 1.6s ease-out 10.8s both; }


.spill { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none; display: none; }
.play .spill { display: block; }
.spill .blob, .spill .stain, .spill .drop { transform-box: fill-box; transform-origin: center; }
.play .spill .wash { animation: wash 0.9s ease-out 3s both; }
.play .spill .blob { animation: splash 1s cubic-bezier(0.2, 1.25, 0.4, 1) calc(0.3s + var(--k) * 0.7s) both; }
.play .spill .drop { animation: fling 1.1s cubic-bezier(0.1, 0.9, 0.3, 1) calc(0.45s + var(--k) * 0.7s) both; }
.play .spill .paint { animation: lift 1.1s ease-in 3.8s both; }
.play .spill .stain { animation: stain 0.8s cubic-bezier(0.3, 1.5, 0.5, 1) calc(4.4s + var(--k) * 0.2s) both; }
@keyframes splash { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes fling { from { transform: translate(calc(var(--dx) * -1px), calc(var(--dy) * -1px)) scale(0.2); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes wash { from { opacity: 0; } to { opacity: 1; } }
@keyframes lift { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.08); } }
@keyframes stain { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 0.5; } }
@keyframes pop-in { from { opacity: 0; transform: translateY(14px) scale(0.86); } to { opacity: 1; transform: none; } }
@keyframes floaty { from { transform: translateY(0); } to { transform: translateY(-1.2px); } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes fade-up { from { opacity: 0; transform: translateY(2.4cqw); } to { opacity: 1; transform: none; } }
@keyframes bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes count { from { --d: 0; } to { --d: var(--days); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes ch-in { from { opacity: 0; transform: translateY(40%); filter: blur(0.8cqw); } to { opacity: 1; transform: none; filter: blur(0); } }
@keyframes bounce-in { from { opacity: 0; transform: translateY(-60%) scale(0.6); } to { opacity: 1; transform: none; } }
@keyframes pulse { from { opacity: 0.55; transform: scale(0.96); } to { opacity: 0.9; transform: scale(1.04); } }
@keyframes drop { from { transform: translateY(-34px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sway { from { transform: rotate(-2.6deg); } to { transform: rotate(2.6deg); } }
@keyframes rise { from { transform: translateY(70px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes lean { from { transform: rotate(0deg); } to { transform: rotate(4deg); } }
@keyframes lean-b { from { transform: rotate(0deg); } to { transform: rotate(-4deg); } }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 0.95; } }
@keyframes burst { 0% { transform: translate(0, 0) scale(0.2); opacity: 0; } 8% { opacity: 1; } 100% { transform: translate(calc(var(--dx) * 1px), calc(var(--dy) * 1px)) scale(1); opacity: 0; } }
@keyframes up-l { from { transform: rotate(10deg); opacity: 0; } to { transform: rotate(150deg); opacity: 1; } }
@keyframes up-r { from { transform: rotate(-10deg); opacity: 0; } to { transform: rotate(-150deg); opacity: 1; } }
@keyframes wave-l { from { transform: rotate(142deg); } to { transform: rotate(162deg); } }
@keyframes wave-r { from { transform: rotate(-142deg); } to { transform: rotate(-162deg); } }
@keyframes shower {
  0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
  8% { opacity: 0.95; }
  30% { transform: translate(6cqw, 52cqw) rotate(90deg); }
  60% { transform: translate(-4cqw, 106cqw) rotate(190deg); }
  100% { transform: translate(5cqw, 190cqw) rotate(340deg); opacity: 0; }
}

.art .spk{opacity:.9}
.play .spk{animation:spk 1.6s ease-in-out calc(var(--q) * .23s) infinite alternate both}
@keyframes spk{from{opacity:.1}to{opacity:1}}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  .petals { display: none; }
}
</style>

</head>
<body>
<main class="frame">
  <section class="stage" id="stage" aria-label="Pink Haldi invitation for Simran and Farhan">
    <div class="bar" aria-hidden="true"><i></i></div>
    <svg class="art" id="art" viewBox="0 0 100 177.78" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
      <circle class="glow" cx="50" cy="56" r="44" fill="#ffe3ee" opacity="0.75" style="transform-box: fill-box; transform-origin: center"/>
      <g class="toran" id="toran"></g>
      <g id="people"></g>
      <g class="fg" id="fg" transform="translate(0 9)"></g>
      <g class="burst" id="burst"></g>
    </svg>
    <div class="petals" id="petals" aria-hidden="true"></div>
    <svg class="spill" id="spill" viewBox="0 0 100 177.78" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><g class="paint" id="paint"></g><g id="stains"></g></svg>

    <div class="txt">
      <p class="kicker" id="kicker"></p>
      <h1 class="event" id="event" data-split></h1>
      <h2 class="names" id="names" data-split></h2>
      <div class="rule" aria-hidden="true"></div>
      <p class="when" id="when"></p>
      <p class="time" id="time"></p>
      <p class="where" id="where"></p>
      <p class="dress" id="dress"></p>
      <p class="cnt" id="cnt"><span class="num" id="num"><span class="sr" id="numText">58</span></span> <span id="unit">days to go</span></p>
    </div>
  </section>
  <div class="controls">
    <button type="button" id="pause" aria-pressed="false">Pause</button>
    <button type="button" id="again" class="again">Watch again</button>
  </div>
</main>

<script>
(function () {
  // Everything that changes per event lives here. The venue and times are placeholders until the family confirms them.
  var EVENT = {
    kicker: 'You are invited to the pink',
    name: 'Haldi',
    couple: 'Simran & Farhan',
    date: '2026-12-24',
    time: '11:00 AM',
    venue: 'Venue to be confirmed',
    dress: 'Wear pink and nothing you mind getting stained.'
  };
  (function () {
    var q = new URLSearchParams(location.search);
    ['date', 'time', 'venue', 'dress', 'couple'].forEach(function (k) { if (q.get(k)) EVENT[k] = q.get(k); });
  })();

  var NS = 'http://www.w3.org/2000/svg';
  var stage = document.getElementById('stage');
  var pauseBtn = document.getElementById('pause');
  var againBtn = document.getElementById('again');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function svg(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function html(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }

  /* ---------- text ---------- */
  var when = new Date(EVENT.date + 'T00:00:00');
  document.getElementById('kicker').textContent = EVENT.kicker;
  document.getElementById('event').textContent = EVENT.name;
  document.getElementById('names').textContent = EVENT.couple;
  document.getElementById('when').textContent = when.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('time').textContent = EVENT.time + '  \u00b7  ' + EVENT.venue;
  document.getElementById('where').textContent = EVENT.venue;
  document.getElementById('dress').textContent = EVENT.dress;

  document.querySelectorAll('[data-split]').forEach(function (h) {
    var text = h.textContent;
    h.setAttribute('aria-label', text);
    h.textContent = '';
    Array.from(text).forEach(function (ch, idx) {
      var s = html('span', ch === '&' ? 'ch amp' : 'ch');
      s.setAttribute('aria-hidden', 'true');
      s.style.setProperty('--i', idx);
      s.textContent = ch === ' ' ? ' ' : ch;
      h.appendChild(s);
    });
  });

  // Days to go: whole days, same method as the website.
  var target = when.getTime(), now = Date.now(), days = Math.floor((target - now) / 864e5);
  var cnt = document.getElementById('cnt');
  if (days >= 1) {
    document.getElementById('num').style.setProperty('--days', days);
    document.getElementById('numText').textContent = days;
    document.getElementById('unit').textContent = days === 1 ? 'day to go' : 'days to go';
  } else if (target > now) cnt.textContent = 'Tomorrow';
  else if (now < target + 864e5) cnt.textContent = 'Today is the day';
  else cnt.hidden = true;

  /* ---------- the couple (original illustrations, drawn in code) ---------- */
  var SKIN_B = '#e5b293', SKIN_G = '#d9a07f', HAIR = '#1b1210';

  function arm(px, py, side, sleeve, skin) {
    return '<g class="arm ' + (side === 'l' ? 'arm-l' : 'arm-r') + '" style="transform-origin:' + px + 'px ' + py + 'px">' +
      '<line x1="' + px + '" y1="' + py + '" x2="' + px + '" y2="' + (py + 44) + '" stroke="' + sleeve + '" stroke-width="13" stroke-linecap="round"/>' +
      '<circle cx="' + px + '" cy="' + (py + 50) + '" r="7.2" fill="' + skin + '"/>' + (skin === SKIN_B ? '<circle cx="' + px + '" cy="' + (py + 50) + '" r="4.6" fill="#8a3a1f" opacity="0.75"/><circle cx="' + px + '" cy="' + (py + 41) + '" r="6.8" fill="none" stroke="#d9a53a" stroke-width="1.6"/>' : '') + '</g>';
  }
  function flowers(points, r) {
    return points.map(function (p) {
      return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + r + '" fill="#e8337f"/><circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (r * 0.48) + '" fill="#ffb3d1"/>';
    }).join('');
  }

  function bride(k) {
    var sp = '';
    [[22,40],[34,70],[26,104],[98,44],[88,76],[96,110],[44,128],[76,132],[60,118]].forEach(function (p, n) {
      sp += '<circle class="spk" style="--q:' + n + '" cx="' + p[0] + '" cy="' + p[1] + '" r="1.5" fill="#fff"/>';
    });
    return '<g class="rise-g" style="--k:' + k + '"><g class="lean-b"><g class="bob" style="--k:' + k + '">' +
      arm(97, 118, 'r', '#efdcbc', SKIN_B) + +
      '<path d="M60 4 C20 8 4 62 2 150 L118 150 C116 62 100 8 60 4 Z" fill="#f6e8cf" fill-opacity="0.8" stroke="#d9a53a" stroke-width="1.6" stroke-dasharray="0.1 4" stroke-linecap="round"/>' +
      '<path d="M30 66 C16 26 42 6 60 6 C80 6 104 26 90 66 C98 92 104 118 98 150 L22 150 C16 118 22 92 30 66 Z" fill="#1b1210"/>' +
      '<path d="M28 90 C34 110 26 130 30 148 M92 90 C86 110 94 130 90 148" fill="none" stroke="#3a2420" stroke-width="2" stroke-linecap="round"/>' +
      '<rect x="52" y="72" width="16" height="28" rx="6" fill="#d9a07f"/>' +
      '<path d="M17 150 C17 114 38 96 60 96 C82 96 103 114 103 150 Z" fill="#e3c9a0"/>' +
      '<path d="M44 98 L60 114 L76 98" fill="none" stroke="#f6e8cf" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M50 96 L60 110 L70 96 Z" fill="#e5b293"/>' +
      '<path d="M45 90 Q60 104 75 90" fill="none" stroke="#d3dae2" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.1 4.4"/>' +
      '<ellipse cx="60" cy="52" rx="24" ry="27" fill="#e5b293"/>' +
      '<path d="M35 52 C32 20 88 20 85 52 C80 34 68 28 58 30 C48 32 38 40 35 52 Z" fill="#1b1210"/>' +
      '<path d="M60 26 C52 30 44 40 38 52" fill="none" stroke="#4a2c24" stroke-width="1.6" stroke-linecap="round"/>' +
      '<ellipse cx="42" cy="62" rx="5" ry="3" fill="#e8736f" opacity="0.45"/><ellipse cx="78" cy="62" rx="5" ry="3" fill="#e8736f" opacity="0.45"/>' +
      '<path d="M43 44 Q50 40 57 44 M63 44 Q70 40 77 44" fill="none" stroke="#1b1210" stroke-width="1.7" stroke-linecap="round"/>' +
      '<g class="eyes" style="--k:' + k + '"><ellipse cx="50" cy="52" rx="2.8" ry="3.4" fill="#4a2a1c"/><ellipse cx="70" cy="52" rx="2.8" ry="3.4" fill="#4a2a1c"/><circle cx="51" cy="50.8" r="0.9" fill="#fff"/><circle cx="71" cy="50.8" r="0.9" fill="#fff"/><path d="M45.5 49 Q50 46.6 54.5 49 M65.5 49 Q70 46.6 74.5 49" fill="none" stroke="#2a1810" stroke-width="1.2" stroke-linecap="round"/></g>' +
      '<path d="M60 55 q-2 5 0 6" fill="none" stroke="#c98d6c" stroke-width="1.2" stroke-linecap="round"/>' +
      '<path d="M52 64 Q60 70 68 64" fill="none" stroke="#c0605a" stroke-width="2" stroke-linecap="round"/>' +
      '<ellipse class="cheek" cx="43" cy="62" rx="6.4" ry="4.4" fill="#ff4f9a" transform="rotate(-18 43 62)"/>' + +
      sp + '</g></g></g>';
  }
  function groom(k) {
    return '<g class="rise-g" style="--k:' + k + '"><g class="lean-g"><g class="bob" style="--k:' + k + '">' +
      arm(22, 120, 'l', '#fbf3dc', SKIN_G) +
      '<rect x="53" y="72" width="14" height="28" rx="6" fill="#c98f6e"/>' +
      '<path d="M9 150 C9 112 34 98 60 98 C86 98 111 112 111 150 Z" fill="#fbf3dc"/>' +
      '<path d="M84 100 L100 108 L42 150 L22 150 Z" fill="#e8337f"/>' +
      '<path d="M50 98 L60 116 L70 98 Z" fill="#fffaf0"/>' +
      '<path d="M40 100 Q60 124 80 100" fill="none" stroke="#e8337f" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="0.1 7.6"/>' +
      '<ellipse cx="35" cy="54" rx="4" ry="6" fill="' + SKIN_G + '"/><ellipse cx="85" cy="54" rx="4" ry="6" fill="' + SKIN_G + '"/>' +
      '<ellipse cx="60" cy="52" rx="25" ry="27" fill="' + SKIN_G + '"/>' +
      '<path d="M35 48 C33 20 87 20 85 48 C82 36 72 31 60 31 C48 31 38 36 35 48 Z" fill="#15100e"/>' +
      '<path d="M36 56 C36 84 84 84 84 56 C81 70 72 74 60 74 C48 74 39 70 36 56 Z" fill="' + HAIR + '"/>' +
      '<path d="M48 63 Q54 59 60 62 Q66 59 72 63 Q66 67 60 65 Q54 67 48 63 Z" fill="' + HAIR + '"/>' +
      '<path d="M53 68 Q60 75 67 68 Q60 70 53 68 Z" fill="#fff"/>' +
      '<path d="M40 39 Q47 36 55 39 M65 39 Q73 36 80 39" fill="none" stroke="#15100e" stroke-width="2" stroke-linecap="round"/>' +
      '<g class="eyes" style="--k:' + k + '"><circle cx="47" cy="50" r="2.6" fill="#2a1810"/><circle cx="73" cy="50" r="2.6" fill="#2a1810"/></g>' +
      '<g fill="rgba(255,255,255,0.14)" stroke="#1d1d1d" stroke-width="1.8"><rect x="38" y="43" width="18" height="13" rx="5"/><rect x="64" y="43" width="18" height="13" rx="5"/></g>' +
      '<path d="M56 49 H64 M38 48 L35 50 M82 48 L85 50" fill="none" stroke="#1d1d1d" stroke-width="1.6" stroke-linecap="round"/>' +
      '<ellipse class="cheek" cx="77" cy="61" rx="6.4" ry="4.4" fill="#ff4f9a" transform="rotate(18 77 61)"/>' +
      arm(98, 120, 'r', '#fbf3dc', SKIN_G).replace('arm-r', 'arm-r hidden').replace('class="arm arm-r hidden"', 'class="arm arm-r" style="display:none"') +
      '</g></g></g>';
  }

  var people = document.getElementById('people');
  var pop = svg('g', { class: 'couple-pop' }, people);
  svg('image', { class: 'couple', href: 'haldi-couple.webp', x: 12, y: 22, width: 76, height: 76, preserveAspectRatio: 'xMidYMid meet' }, pop);

  /* ---------- garlands, flower bank, haldi burst ---------- */
  var toran = document.getElementById('toran');
  svg('path', { d: 'M-2 5 Q12 15 25 5 T50 5 T75 5 T102 5', fill: 'none', stroke: '#1f6b46', 'stroke-width': 0.9 }, toran);
  for (var i = 0; i < 21; i++) {
    var fx = -2 + i * 5.1, fy = 5 + (i % 2 ? 4.6 : 0) * 0 + ((i % 4) < 2 ? (i % 2 ? 4.8 : 1) : (i % 2 ? 1 : 4.8));
    svg('circle', { cx: fx, cy: fy, r: 1.9, fill: i % 2 ? '#e8337f' : '#ffb3d1' }, toran);
  }
  [[8, 24], [20, 14], [33, 22], [67, 20], [80, 26], [92, 16]].forEach(function (c, idx) {
    var g = svg('g', { class: 'strand', style: 'transform-origin:' + c[0] + 'px 7px; --k:' + idx }, toran);
    svg('line', { x1: c[0], y1: 7, x2: c[0], y2: c[1] + 7, stroke: '#1f6b46', 'stroke-width': 0.5 }, g);
    for (var y = 10, n = 0; y < c[1] + 7; y += 4.3, n++) {
      svg('circle', { cx: c[0], cy: y, r: 2.3, fill: n % 2 ? '#ffb3d1' : '#e8337f' }, g);
      svg('circle', { cx: c[0], cy: y, r: 0.9, fill: '#a3124f' }, g);
    }
  });
  var fg = document.getElementById('fg');
  svg('rect', { x: -2, y: 83, width: 104, height: 14, fill: '#2f7d4a' }, fg);
  for (var f = 0; f < 24; f++) {
    var x = -1 + f * 4.4, y = 83.5 + (f % 2) * 3;
    svg('ellipse', { cx: x, cy: y + 4, rx: 3.6, ry: 1.9, fill: '#1f6b46', transform: 'rotate(' + (f % 2 ? 18 : -18) + ' ' + x + ' ' + (y + 4) + ')' }, fg);
    svg('circle', { cx: x, cy: y, r: 3.5, fill: f % 3 ? '#e8337f' : '#ffb3d1' }, fg);
    svg('circle', { cx: x, cy: y, r: 1.5, fill: '#a3124f' }, fg);
  }

  // A burst of flowers when the couple appear, thrown up and outward from behind them.
  var burst = document.getElementById('burst');
  var fc = ['#e8337f', '#ffb3d1', '#ff8fba', '#ffffff', '#ff4f9a'];
  for (var b = 0; b < 30; b++) {
    var ang = (b / 30) * Math.PI * 2, dist = 22 + (b % 4) * 9;
    var fl = svg('g', { style: '--k:' + b + ';--dx:' + (Math.cos(ang) * dist * 1.1).toFixed(1) + ';--dy:' + (Math.sin(ang) * dist - 14).toFixed(1) }, burst);
    svg('circle', { cx: 50, cy: 62, r: 1.7 + (b % 3) * 0.5, fill: fc[b % 5] }, fl);
    svg('circle', { cx: 50, cy: 62, r: 0.7, fill: '#ffd54f' }, fl);
  }

  // The flower shower: pink petals and little flowers falling the whole time.
  var petals = document.getElementById('petals');
  for (var q = 0; q < 38; q++) {
    var s = html('span', q % 3 === 0 ? 'f' : '');
    s.style.setProperty('--x', ((q * 41 + 9) % 94) + '%');
    s.style.setProperty('--w', (2 + (q % 3) * 0.7 + (q % 3 === 0 ? 1 : 0)).toFixed(1) + 'cqw');
    s.style.setProperty('--c', fc[q % fc.length]);
    s.style.setProperty('--dl', ((q * 0.55) % 7).toFixed(1) + 's');
    s.style.setProperty('--t', (7 + ((q * 1.3) % 5)).toFixed(1) + 's');
    petals.appendChild(s);
  }

  // Opening: pink colour is flung across the screen, then lifts to reveal the couple. A few stains stay in the corners.
  function blob(cx, cy, r, seed) {
    var n = 14, pts = [];
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2, rr = r * (0.82 + 0.3 * Math.abs(Math.sin(seed * 3.1 + i * 1.7)));
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
    }
    var d = 'M' + ((pts[0][0] + pts[n - 1][0]) / 2).toFixed(1) + ' ' + ((pts[0][1] + pts[n - 1][1]) / 2).toFixed(1);
    for (var j = 0; j < n; j++) {
      var p = pts[j], q = pts[(j + 1) % n];
      d += ' Q' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ' ' + ((p[0] + q[0]) / 2).toFixed(1) + ' ' + ((p[1] + q[1]) / 2).toFixed(1);
    }
    return d + ' Z';
  }
  // A paint splat: a fat core with pointed arms flying outward, plus droplets that land around it.
  function splat(cx, cy, r, seed) {
    var n = 22, pts = [];
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + seed, spike = i % 2 === 0;
      var rr = spike ? r * (1.35 + 0.75 * Math.abs(Math.sin(seed * 2.3 + i * 2.1))) : r * (0.72 + 0.12 * Math.sin(i + seed));
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
    }
    var d = 'M' + ((pts[0][0] + pts[n - 1][0]) / 2).toFixed(1) + ' ' + ((pts[0][1] + pts[n - 1][1]) / 2).toFixed(1);
    for (var j = 0; j < n; j++) {
      var p = pts[j], q = pts[(j + 1) % n];
      d += ' Q' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ' ' + ((p[0] + q[0]) / 2).toFixed(1) + ' ' + ((p[1] + q[1]) / 2).toFixed(1);
    }
    return d + ' Z';
  }
  var paint = document.getElementById('paint');
  svg('rect', { class: 'wash', x: -2, y: -2, width: 104, height: 182, fill: '#ff8fba' }, paint);
  var pinks = ['#ff4f9a', '#e8337f', '#ff8fba', '#ffb3d1', '#c2185b', '#ff6fae', '#f03c8a'];
  [[25, 32, 40], [78, 64, 42], [30, 122, 42], [72, 152, 44]].forEach(function (b, i) {
    svg('path', { class: 'blob', d: splat(b[0], b[1], b[2], i * 0.7 + 0.3), fill: pinks[i % pinks.length], style: '--k:' + i }, paint);
    for (var k = 0; k < 4; k++) {
      var ang = k * 0.9 + i, dist = b[2] * (1.7 + (k % 3) * 0.35), dr = 1.2 + (k % 4) * 0.9;
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      svg('circle', { class: 'drop', cx: (b[0] + dx).toFixed(1), cy: (b[1] + dy).toFixed(1), r: dr, fill: pinks[(i + k) % pinks.length], style: '--k:' + i + ';--dx:' + dx.toFixed(1) + ';--dy:' + dy.toFixed(1) }, paint);
    }
  });
  var stains = document.getElementById('stains');
  [[7, 112, 6], [94, 126, 5], [6, 172, 7], [93, 174, 6], [90, 106, 3]].forEach(function (b, i) {
    svg('path', { class: 'stain', d: blob(b[0], b[1], b[2], i + 9), fill: pinks[(i + 1) % pinks.length], style: '--k:' + i }, stains);
  });

  /* ---------- controls ---------- */
  function play() {
    stage.classList.remove('play', 'paused', 'done');
    void stage.offsetWidth;
    pauseBtn.setAttribute('aria-pressed', 'false');
    pauseBtn.textContent = 'Pause';
    if (!reduce) stage.classList.add('play');
  }
  pauseBtn.addEventListener('click', function () {
    var paused = stage.classList.toggle('paused');
    pauseBtn.setAttribute('aria-pressed', String(paused));
    pauseBtn.textContent = paused ? 'Play' : 'Pause';
  });
  againBtn.addEventListener('click', play);
  stage.querySelector('.bar i').addEventListener('animationend', function () { stage.classList.add('done'); });
  if (reduce) { pauseBtn.hidden = true; againBtn.hidden = true; }
  play();
})();
</script>
</body>
</html>
